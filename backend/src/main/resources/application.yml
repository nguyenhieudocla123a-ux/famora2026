# Local secrets come from the .env file at the repository root (never committed; copy .env.example).
spring:
  application:
    name: famora
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/famora}
    username: ${POSTGRES_USER:famora}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

famora:
  jwt:
    secret: ${JWT_SECRET:} # blank fails fast at startup with a clear message
    issuer: famora
    access-ttl: 15m
    refresh-ttl: 14d
  google:
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:} # blank: Google sign-in answers "not enabled"

server:
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
